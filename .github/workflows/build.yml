name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          unzip -q vokabelio.zip
          cd vokabelio
          bash build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vokabelio-apk
          path: vokabelio/build/app/outputs/flutter-apk/app-release.apk
